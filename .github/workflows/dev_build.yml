name: Dev Build (Linux x64 GUI)

# Local dev helper: build target/release/warp-oss on a GitHub-hosted Linux
# runner and upload it as an artifact that developers download with
# `gh run download` and run directly. No cross-platform builds, no installer
# packaging, no release publishing.
#
# This workflow is intentionally independent of beta_release.yml / ci.yml /
# the shared .github/actions/prepare_environment composite — those reuse
# private action SHAs from warpdotdev/warp-internal that are not resolvable
# from forks (Mi0uno/Agentwarp). We pin only public actions here.

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  WARP_BIN_NAME: warp-oss

permissions:
  contents: read

concurrency:
  # When a developer pushes new commits to the same branch, cancel any
  # in-flight run and start fresh — keeps Actions minutes low and avoids
  # the user downloading a stale artifact.
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux_gui:
    name: Build Linux x64 warp-oss
    runs-on: ubuntu-latest  # 4 cores / 16 GiB public runner
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Cache ~/.cargo and target/ between runs, keyed on Cargo.lock.
      # Task branches read the master cache but do not write back
      # (save-if: master) to avoid polluting the shared cache.
      - name: Cache cargo registry, index, and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Verify OSS icon
        shell: bash
        run: test -f app/channels/oss/icon/no-padding/icon.ico

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "nproc: $(nproc)"
          echo "free -h:"
          free -h
          echo "df -h /:"
          df -h /
          echo "rustc: $(rustc --version)"

      - name: Build warp-oss (release)
        # Public `ubuntu-latest` runner is 4 cores / 16 GiB. Cap at -j 4.
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -j 4 -p warp --bin warp-oss

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          test -x "target/release/${WARP_BIN_NAME}"
          file "target/release/${WARP_BIN_NAME}"
          "./target/release/${WARP_BIN_NAME}" --version || true

      - name: Bundle artifact (warp-oss + build markers)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/release/${WARP_BIN_NAME}" "dist/${WARP_BIN_NAME}"
          # Record the commit SHA so a developer can match a downloaded
          # artifact back to a git ref without guessing.
          printf '%s\n' "${{ github.sha }}" > dist/BUILD_SHA
          printf '%s\n' "${{ github.ref_name }}" > dist/BUILD_REF
          printf '%s\n' "${{ github.run_id }}" > dist/BUILD_RUN_ID
          printf '%s\n' "${{ github.run_number }}" > dist/BUILD_RUN_NUMBER
          tar -C dist -czf "warp-oss-linux-x64.tar.gz" .
          ls -lh "warp-oss-linux-x64.tar.gz"

      - name: Upload Linux GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-oss-linux-x64
          path: warp-oss-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
