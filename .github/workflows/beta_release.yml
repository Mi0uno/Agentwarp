name: Beta Release

on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish.
        required: true
        default: v1.0.0-beta.1

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_CHANNEL: oss
  RELEASE_NAME: Beta 1.0.0

jobs:
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create prerelease
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Agentwarp Beta 1.0.0.

            Assets:
            - Windows x64 installer
            - Windows ARM64 installer
            - Linux amd64 Debian package
          draft: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

  linux_deb:
    name: Build Linux .deb
    runs-on: ubuntu-22.04
    needs: create_release
    timeout-minutes: 120
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_release_deps: true

      - name: Install Debian packaging tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fakeroot

      - name: Verify OSS icon
        shell: bash
        run: test -f app/channels/oss/icon/no-padding/icon.ico

      - name: Build Debian package
        shell: bash
        run: script/bundle --channel "$RELEASE_CHANNEL" --release-tag "$RELEASE_TAG" --packages deb
        env:
          RELEASE_TAG: ${{ needs.create_release.outputs.release_tag }}

      - name: Upload Debian package
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.create_release.outputs.release_tag }}
          files: target/*/bundle/linux/*.deb
          token: ${{ secrets.GITHUB_TOKEN }}

  windows_installer:
    name: Build Windows installer (${{ matrix.arch }})
    runs-on: windows-latest
    needs: create_release
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          cache_key: windows-${{ matrix.arch }}
          is_self_hosted: false
          install_release_deps: true

      - name: Add ARM64 Rust target
        if: ${{ matrix.arch == 'arm64' }}
        shell: bash
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Select-Object -ExpandProperty FullName

      - name: Verify OSS icon
        shell: pwsh
        run: |
          if (-not (Test-Path "app\channels\oss\icon\no-padding\icon.ico")) {
              throw "Missing OSS Windows icon"
          }

      - name: Install OpenSSL
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            $vcpkgRoot = "C:\vcpkg"
          }

          if (-not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          }

          if ("${{ matrix.arch }}" -eq "arm64") {
            $triplet = "arm64-windows-static"
          } else {
            $triplet = "x64-windows-static"
          }

          & (Join-Path $vcpkgRoot "vcpkg.exe") install "openssl:$triplet" --clean-after-build
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          $log = "windows-${{ matrix.arch }}-bundle.log"
          & .\script\windows\bundle.ps1 `
            -CHANNEL "$env:RELEASE_CHANNEL" `
            -RELEASE_TAG "$env:RELEASE_TAG" `
            -ARCH "${{ matrix.arch }}" 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE

          if ($status -ne 0) {
            $tail = Get-Content $log -Tail 80 | Out-String
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows ${{ matrix.arch }} bundle failed::$escaped"
            exit $status
          }
        env:
          RELEASE_TAG: ${{ needs.create_release.outputs.release_tag }}

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-bundle-log-${{ matrix.arch }}
          path: windows-${{ matrix.arch }}-bundle.log
          if-no-files-found: ignore

      - name: Upload installer
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.create_release.outputs.release_tag }}
          files: script/windows/Output/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
